# Runs the server tests, then pushes gas/ to Apps Script with clasp and updates the existing
# web app deployment, so the /exec URL never changes.
#
# Repo secrets (Settings › Secrets and variables › Actions):
#   CLASPRC_JSON           contents of ~/.clasprc.json after `npx @google/clasp@2.4.2 login` on your PC
#   GAS_SCRIPT_ID          Apps Script › Project Settings › Script ID
#   GAS_DEPLOYMENT_ID      Apps Script › Deploy › Manage deployments › Deployment ID (the web app)
name: Deploy Apps Script API

on:
  push:
    branches: [main]
    paths: ['gas/**', 'test/server.test.js', 'test/gasmock.js', '.github/workflows/gas-deploy.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/server.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          if [ -n "$CLASPRC_JSON" ] && [ -n "$GAS_SCRIPT_ID" ] && [ -n "$GAS_DEPLOYMENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped Apps Script deploy — add CLASPRC_JSON, GAS_SCRIPT_ID and GAS_DEPLOYMENT_ID secrets to enable it (README step 4)."
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write clasp credentials
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          # Accept any clasp credentials layout (2.x "token", 3.x "tokens.default", …) and write the 2.4.2 one.
          node -e '
            const src = JSON.parse(process.env.CLASPRC_JSON);
            const find = (o, keys) => { if (!o || typeof o !== "object") return ""; for (const k of keys) if (typeof o[k] === "string" && o[k]) return o[k];
              for (const v of Object.values(o)) { const r = find(v, keys); if (r) return r; } return ""; };
            const rt = find(src, ["refresh_token", "refreshToken"]);
            const id = find(src, ["client_id", "clientId"]);
            const sec = find(src, ["client_secret", "clientSecret"]);
            if (!rt || !id || !sec) { console.error("CLASPRC_JSON is missing:", [!rt && "refresh_token", !id && "client_id", !sec && "client_secret"].filter(Boolean).join(", ")); process.exit(1); }
            const out = { token: { access_token: "", refresh_token: rt, scope: find(src, ["scope"]), token_type: "Bearer", expiry_date: 0 },
              oauth2ClientSettings: { clientId: id, clientSecret: sec, redirectUri: "http://localhost" }, isLocalCreds: false };
            require("fs").writeFileSync(require("os").homedir() + "/.clasprc.json", JSON.stringify(out));
          '
          printf '{"scriptId":"%s","rootDir":"gas"}' "$GAS_SCRIPT_ID" > .clasp.json
      - name: Push code
        if: steps.check.outputs.ready == 'true'
        run: npx --yes @google/clasp@2.4.2 push --force
      - name: Update web app deployment
        if: steps.check.outputs.ready == 'true'
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: npx --yes @google/clasp@2.4.2 deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "${GITHUB_SHA::7}"
