# Publishes the web/ folder to GitHub Pages on every push to main.
# One-time: repo Settings › Pages › Source = "GitHub Actions".
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Cache-busting: every deploy gets ?v=<commit> on our own files so browsers never mix an old app.js with a new API.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|drawer\.js|customer\.js|promo\.js|app\.js)\"#\1=\"\2?v=$v\"#g" web/index.html
          grep -n "?v=" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
